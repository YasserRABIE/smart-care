name: smart-care

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartcare
      POSTGRES_PASSWORD: smartcare
      POSTGRES_DB: smartcare
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartcare -d smartcare']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
