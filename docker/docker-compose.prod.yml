# Production stack for the VPS. Lives at /opt/smart-care/docker-compose.yml next to
# Caddyfile and .env (see docker/.env.production.example). The web image is built in CI.
name: smart-care

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: smartcare
    # Localhost only: reach it through an SSH tunnel, never from the internet.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartcare -d smartcare']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/smart-care-web:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media:/app/apps/web/media

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
